<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie — Impressions 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0e0e;
    --panel: #101616;
    --border: #1e2a2a;
    --text: #d7e2e0;
    --muted: #5f7574;
    --accent: #00e5c7;
    --accent-dim: #0a3d38;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'IBM Plex Mono',monospace; -webkit-font-smoothing:antialiased; min-height:100vh; }
  ::selection{ background:var(--accent-dim); color:var(--accent); }

  header{ padding:48px 32px 24px; max-width:1240px; margin:0 auto; border-bottom:1px solid var(--border); text-align:center; }
  .eyebrow{ font-size:11px; letter-spacing:0.14em; color:var(--accent); text-transform:uppercase; margin-bottom:10px; display:flex; align-items:center; justify-content:center; gap:8px; }
  .eyebrow::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); }
  h1{ font-size:clamp(28px,4vw,42px); font-weight:600; margin:0 0 16px; letter-spacing:-0.01em; }
  h1 span{ color:var(--accent); }
  .stats-row{ display:flex; justify-content:center; gap:28px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
  .stats-row strong{ color:var(--text); font-weight:600; }

  .grid{ max-width:1240px; margin:0 auto; padding:32px 32px 80px; display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px; }

  .card{ background:var(--panel); border:1px solid var(--border); border-radius:4px; overflow:hidden; cursor:pointer; transition:border-color 0.15s ease,transform 0.15s ease; display:flex; flex-direction:column; }
  .card:hover{ border-color:var(--accent); transform:translateY(-2px); }
  .card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .thumb{ width:100%; aspect-ratio:1/1; background:#06090a; position:relative; overflow:hidden; }
  .thumb canvas{ width:100% !important; height:100% !important; display:block; }
  .hint{ position:absolute; bottom:8px; left:50%; transform:translateX(-50%); font-size:9px; color:var(--muted); letter-spacing:0.05em; white-space:nowrap; opacity:0.7; }

  .card-body{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .card-title{ font-size:13px; font-weight:600; color:var(--text); display:flex; justify-content:space-between; gap:8px; }
  .card-title .id{ color:var(--muted); font-weight:400; }
  .spec-line{ display:grid; grid-template-columns:repeat(2,1fr); gap:6px; font-size:10px; color:var(--muted); border-top:1px solid var(--border); padding-top:10px; }
  .spec-line div span{ display:block; color:var(--text); font-size:11px; margin-top:2px; }

  .couleurs{ display:flex; gap:6px; align-items:center; border-top:1px solid var(--border); padding-top:10px; flex-wrap:wrap; }
  .couleurs .label{ font-size:10px; color:var(--muted); margin-right:2px; }
  .pastille{ width:16px; height:16px; border-radius:50%; border:1px solid rgba(255,255,255,0.15); flex-shrink:0; }

  .lightbox{ position:fixed; inset:0; background:rgba(6,9,10,0.92); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:100; padding:24px; }
  .lightbox.open{ display:flex; }
  .lb-panel{ background:var(--panel); border:1px solid var(--border); border-radius:6px; max-width:900px; width:100%; max-height:90vh; overflow:auto; display:grid; grid-template-columns:1.2fr 1fr; position:relative; }
  @media(max-width:720px){ .lb-panel{ grid-template-columns:1fr; } }
  .lb-viewer{ background:#06090a; min-height:300px; position:relative; }
  .lb-viewer canvas{ width:100% !important; height:100% !important; display:block; }
  .lb-info{ padding:28px; display:flex; flex-direction:column; gap:18px; }
  .lb-close{ position:absolute; top:12px; right:12px; background:transparent; border:1px solid var(--border); color:var(--muted); width:32px; height:32px; border-radius:3px; cursor:pointer; font-size:16px; line-height:32px; text-align:center; font-family:inherit; transition:color 0.15s,border-color 0.15s; z-index:10; }
  .lb-close:hover{ color:var(--accent); border-color:var(--accent); }
  .lb-title{ font-size:18px; font-weight:600; padding-right:28px; }
  .lb-desc{ font-size:13px; color:var(--muted); line-height:1.7; }
  .lb-specs{ display:grid; grid-template-columns:1fr 1fr; gap:12px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); padding:16px 0; }
  .lb-specs .k{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; }
  .lb-specs .v{ font-size:13px; color:var(--accent); margin-top:3px; }
  .lb-couleurs{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .lb-couleurs .label{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-right:4px; }
  .lb-pastille{ display:flex; flex-direction:column; align-items:center; gap:4px; font-size:9px; color:var(--muted); letter-spacing:0.03em; }
  .lb-pastille div{ width:22px; height:22px; border-radius:50%; border:1px solid rgba(255,255,255,0.15); }
  .lb-personnalise-btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--accent-dim); border:1px solid var(--accent); color:var(--accent); font-family:inherit; font-size:12px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; text-decoration:none; padding:10px 16px; border-radius:3px; cursor:pointer; transition:background 0.15s ease,color 0.15s ease; width:fit-content; }
  .lb-personnalise-btn:hover{ background:var(--accent); color:#06090a; }

  footer{ max-width:1240px; margin:0 auto; padding:24px 32px 48px; color:var(--muted); font-size:11px; border-top:1px solid var(--border); text-align:center; }

  /* ===== Vue Personnalisation ===== */
  #customizeView{ display:none; }
  .cz-header{ padding:20px 32px; display:flex; align-items:baseline; gap:20px; flex-wrap:wrap; border-bottom:1px solid var(--border); }
  .cz-back{ font-size:11px; letter-spacing:0.08em; color:var(--muted); text-decoration:none; text-transform:uppercase; background:none; border:none; cursor:pointer; font-family:inherit; padding:0; }
  .cz-back:hover{ color:var(--accent); }
  .cz-title-group{ display:flex; align-items:baseline; gap:10px; }
  .cz-eyebrow{ font-size:10px; letter-spacing:0.14em; color:var(--accent); text-transform:uppercase; display:flex; align-items:center; gap:6px; }
  .cz-eyebrow::before{ content:''; width:5px; height:5px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); }
  .cz-h1{ font-size:18px; font-weight:600; letter-spacing:-0.01em; }
  .cz-h1 span{ color:var(--accent); }

  .cz-layout{ display:grid; grid-template-columns:3fr 1fr; align-items:stretch; }
  @media(max-width:760px){ .cz-layout{ grid-template-columns:1fr; } }

  .viewer-stage{ width:100%; height:82vh; background:#06090a; position:relative; }
  .viewer-stage canvas{ width:100% !important; height:100% !important; display:block; }
  .viewer-stage .hint{ position:absolute; bottom:16px; left:50%; transform:translateX(-50%); font-size:10px; color:var(--muted); letter-spacing:0.05em; white-space:nowrap; opacity:0.7; }
  @media(max-width:760px){ .viewer-stage{ height:50vh; } }

  .cz-controls{ height:82vh; overflow-y:auto; padding:28px 24px; display:flex; flex-direction:column; gap:24px; background:var(--panel); border-left:1px solid var(--border); }
  @media(max-width:760px){ .cz-controls{ height:auto; border-left:none; border-top:1px solid var(--border); } }
  .cz-field label{ display:block; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:10px; }
  .cz-field input[type="text"]{ width:100%; background:var(--panel); border:1px solid var(--border); color:var(--text); font-family:inherit; font-size:15px; padding:12px 14px; border-radius:4px; }
  .cz-field input[type="text"]:focus{ outline:none; border-color:var(--accent); }
  .cz-field .row{ display:flex; align-items:center; gap:14px; }
  .cz-field input[type="range"]{ flex:1; accent-color:var(--accent); }
  .cz-field .val{ font-size:12px; color:var(--accent); min-width:56px; text-align:right; }
  .swatches{ display:flex; gap:12px; flex-wrap:wrap; }
  .swatch{ width:26px; height:26px; border-radius:50%; border:1px solid rgba(255,255,255,0.18); cursor:pointer; transition:transform 0.1s ease; }
  .swatch:hover{ transform:scale(1.08); }
  .swatch.selected{ outline:2px solid var(--accent); outline-offset:2px; }
  .cz-status{ font-size:11px; color:var(--muted); min-height:14px; }
  .cz-send{ margin-top:auto; padding-top:8px; display:flex; flex-direction:column; gap:10px; }
  .cz-send-btn{ width:100%; display:inline-flex; align-items:center; justify-content:center; background:var(--accent); border:1px solid var(--accent); color:#06090a; font-family:inherit; font-size:12px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; padding:13px 16px; border-radius:4px; cursor:pointer; transition:background 0.15s ease,color 0.15s ease; }
  .cz-send-btn:hover:not(:disabled){ background:var(--accent-dim); color:var(--accent); }
  .cz-send-btn:disabled{ opacity:0.6; cursor:default; }
  .cz-send-note{ font-size:11px; line-height:1.5; color:var(--muted); min-height:16px; white-space:pre-line; }
  .cz-copy{ background:none; border:none; padding:0; font-family:inherit; font-size:11px; color:var(--accent); text-align:left; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
  .cz-copy[hidden]{ display:none; }
</style>
</head>
<body>

<div id="galleryView">
<header>
  <div class="eyebrow">Atelier — Fichiers imprimés</div>
  <h1>Mes <span>créations</span><br>imprimées en 3D</h1>
  <div class="stats-row" id="statsRow"></div>
</header>

<main class="grid" id="grid"></main>

<div class="lightbox" id="lightbox">
  <div class="lb-panel" id="lbPanel"></div>
</div>

<footer>Édite le tableau CREATIONS dans le code source pour ajouter une pièce.</footer>
</div>

<div id="customizeView">
  <div class="cz-header">
    <button class="cz-back" onclick="showGallery()">← Retour à la galerie</button>
    <div class="cz-title-group">
      <div class="cz-eyebrow">Atelier — Personnalisation</div>
      <div class="cz-h1">Porte-clés <span>personnalisable</span></div>
    </div>
  </div>

  <div class="cz-layout">
  <div class="viewer-stage" id="czViewer">
    <div class="hint">↔ glisser pour tourner</div>
  </div>

  <div class="cz-controls">
    <div class="cz-field">
      <label for="czTxt">Texte</label>
      <input type="text" id="czTxt" maxlength="16" value="Ton nom">

    <div class="cz-field">

      <div class="row">
        <input type="range" id="czThick" min="0.3" max="4" step="0.1" value="1.5">
        <span class="val" id="czThickVal">1.5 mm</span>
      </div>

    <div class="cz-status" id="czFontStatus">Chargement de la police…</div>
    <div class="cz-send">
      <button class="cz-send-btn" id="czSend" type="button">Envoyer</button>
      <div class="cz-send-note" id="czSendNote"></div>
      <button class="cz-copy" id="czCopy" type="button" hidden>Ou copier le message pour l'envoyer à la main</button>
    </div>
  </div>
  </div>
</div>

<script>
// ✉️ Adresse e-mail qui reçoit les demandes de personnalisation (envoyées automatiquement au clic sur Envoyer)
// ⚠️ L'envoi automatique ne marche que si le site est en ligne (adresse https://…), pas ouvert comme un simple fichier.
const EMAIL_RECEPTION = "Lenzo.dck@icloud.com";

function copieSecours(texte) {
  const ta = document.createElement('textarea');
  ta.value = texte;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  ta.remove();
}

function buildRecap(d) {
  const lignes = [
    "Bonjour,",
    "",
    "Voici ma demande de personnalisation :",
    "",
    "Modèle : " + d.modele,
    "Texte : " + d.texte,
    "Couleur du porte-clé : " + d.couleurPorteCle,
    "Couleur du texte : " + d.couleur,
    "Taille du texte : " + d.taille + " mm",
    "Épaisseur du texte : " + d.epaisseur + " mm"
  ];
  return {
    sujet: "Demande de personnalisation : " + d.modele + " (« " + d.texte + " »)",
    corps: lignes.join("\r\n")
  };
}

// Envoi direct au clic (service FormSubmit) : le message arrive dans la boîte mail, sans ouvrir d'application mail
async function envoyerDemande(d) {
  const r = buildRecap(d);
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  let res;
  try {
    res = await fetch("https://formsubmit.co/ajax/" + EMAIL_RECEPTION, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({
        _subject: r.sujet,
        _template: "table",
        "Modele": d.modele,
        "Texte": d.texte,
        "Couleur du porte-cle": d.couleurPorteCle,
        "Couleur du texte": d.couleur,
        "Taille du texte": d.taille + " mm",
        "Epaisseur du texte": d.epaisseur + " mm"
      }),
      signal: ctrl.signal
    });
  } catch (e) {
    return { ok: false, type: "reseau", message: "", detail: (e && e.name ? e.name : "Erreur") + (e && e.message ? " — " + e.message : "") };
  } finally {
    clearTimeout(timer);
  }
  let data = {};
  try { data = (await res.json()) || {}; } catch (e) {}
  const message = data.message ? String(data.message) : "";
  return {
    ok: res.ok && String(data.success) !== "false",
    type: "service",
    message: message,
    detail: "HTTP " + res.status + (data.success !== undefined ? " · success=" + data.success : "") + (message ? " · " + message.slice(0, 160) : "")
  };
}

// Message affiché quand l'envoi n'a pas abouti (avec la cause réelle sur la ligne « Détail »)
function messageEchec(r) {
  let msg;
  if (r.type === "reseau") {
    msg = "Impossible de joindre le service d'envoi depuis cette page (connexion ou blocage du navigateur). Tu peux copier le message pour l'envoyer à la main.";
  } else if (/web server|html files/i.test(r.message || "")) {
    msg = "L'envoi automatique ne marche pas quand la page est ouverte comme un simple fichier. Mets le site en ligne (par exemple sur GitHub Pages) et ouvre-le avec son adresse web : l'envoi fonctionnera. En attendant, tu peux copier le message pour l'envoyer à la main.";
  } else if (/activ/i.test(r.message || "")) {
    msg = "Le service d'envoi doit d'abord être activé : ouvre le mail de FormSubmit reçu à " + EMAIL_RECEPTION + " (regarde aussi les indésirables), clique sur le lien d'activation, puis réessaie.";
  } else {
    msg = "L'envoi n'a pas abouti. Réessaie dans un instant, ou copie le message pour l'envoyer à la main.";
  }
  return msg + "\nDétail : " + r.detail;
}

// Parser STL binaire
function parseSTL(b64) {
  const bin = atob(b64);
  const buf = new ArrayBuffer(bin.length);
  const view = new Uint8Array(buf);
  for (let i = 0; i < bin.length; i++) view[i] = bin.charCodeAt(i);
  const dv = new DataView(buf);
  const nTri = dv.getUint32(80, true);
  const positions = [];
  for (let i = 0; i < nTri; i++) {
    const off = 84 + i * 50 + 12;
    for (let v = 0; v < 3; v++) {
      positions.push(dv.getFloat32(off + v*12, true));
      positions.push(dv.getFloat32(off + v*12+4, true));
      positions.push(dv.getFloat32(off + v*12+8, true));
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
  geo.computeVertexNormals();
  return geo;
}

function createViewer(container, stlB64) {
  const w = container.clientWidth || 280;
  const h = container.clientHeight || 280;
  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setClearColor(0x06090a, 1);
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, w/h, 0.1, 10000);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dir = new THREE.DirectionalLight(0xffffff, 1.0);
  dir.position.set(1, 2, 3);
  scene.add(dir);
  const dir2 = new THREE.DirectionalLight(0xffffff, 0.3);
  dir2.position.set(-2, -1, -1);
  scene.add(dir2);

  const geo = parseSTL(stlB64);
  geo.center();
  const mat = new THREE.MeshPhongMaterial({ color:0xf0f0f0, specular:0x080808, shininess:5 });
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);

  geo.computeBoundingBox();
  const box = geo.boundingBox;
  const size = new THREE.Vector3();
  box.getSize(size);
  const maxDim = Math.max(size.x, size.y, size.z);
  camera.position.set(0, 0, maxDim * 2);
  camera.lookAt(0, 0, 0);

  // Contrôles souris
  let isDragging = false, prevX = 0, prevY = 0;
  container.addEventListener('mousedown', e => {
    isDragging=true; prevX=e.clientX; prevY=e.clientY;
    // Réinitialiser tous les autres viewers de carte
    Object.entries(cardViewers).forEach(([id, v]) => {
      if (v.mesh !== mesh) v.mesh.rotation.set(0, 0, 0);
    });
  });
  window.addEventListener('mouseup', () => isDragging=false);
  container.addEventListener('mousemove', e => {
    if (!isDragging) return;
    mesh.rotation.y += (e.clientX - prevX) * 0.01;
    mesh.rotation.x += (e.clientY - prevY) * 0.01;
    prevX=e.clientX; prevY=e.clientY;
  });
  // Touch
  let prevTX=0, prevTY=0;
  container.addEventListener('touchstart', e => {
    prevTX=e.touches[0].clientX; prevTY=e.touches[0].clientY;
    // Réinitialiser tous les autres viewers de carte
    Object.entries(cardViewers).forEach(([id, v]) => {
      if (v.mesh !== mesh) v.mesh.rotation.set(0, 0, 0);
    });
  });
  container.addEventListener('touchmove', e => {
    mesh.rotation.y += (e.touches[0].clientX - prevTX) * 0.01;
    mesh.rotation.x += (e.touches[0].clientY - prevTY) * 0.01;
    prevTX=e.touches[0].clientX; prevTY=e.touches[0].clientY;
    e.preventDefault();
  }, {passive:false});

  let animId;
  function animate() {
    animId = requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();
  return { renderer, animId, mesh, mat };
}

// Lightbox
const lightbox = document.getElementById('lightbox');
const lbPanel = document.getElementById('lbPanel');
let lbViewer = null;
let currentCardId = null;

// Grille
CREATIONS.forEach(c => {
  const card = document.createElement('div');
  card.className = 'card';
  card.tabIndex = 0;
  const pastilles = COULEURS.map(col => `<span class="pastille" style="background:${col.hex}" data-hex="${col.hex}" title="${col.nom}"></span>`).join('');
  card.innerHTML = `
    <div class="thumb" id="thumb-${c.id}">
      <div class="hint">↔ glisser pour tourner</div>
    </div>
    <div class="card-body">
      <div class="card-title">${c.title} <span class="id">#${c.id}</span></div>
      <div class="spec-line">
        <div>Matériau<span>${c.material}</span></div>
        <div>Temps<span>${c.printTime}</span></div>
      </div>
      <div class="couleurs"><span class="label">Couleurs</span>${pastilles}</div>
    </div>
  `;
  card.onclick = e => { if (!e.target.closest('.thumb') && !e.target.closest('.couleurs')) openLightbox(c); };
  card.onkeydown = e => { if(e.key==='Enter'||e.key===' ') openLightbox(c); };
  document.getElementById('grid').appendChild(card);

  setTimeout(() => {
    const viewer = createViewer(document.getElementById(`thumb-${c.id}`), c.stl);
    cardViewers[c.id] = viewer;
    viewer.selectedColor = 0xf0f0f0; // Blanc sélectionné par défaut
    // Pastilles cliquables sur la carte
    card.querySelectorAll('.pastille').forEach(p => {
      p.style.cursor = 'pointer';
      if (parseInt(p.dataset.hex.replace('#',''), 16) === viewer.selectedColor) {
        p.style.outline = '2px solid #00e5c7';
        p.style.outlineOffset = '2px';
      }
      p.addEventListener('click', e => {
        e.stopPropagation();
        const hex = parseInt(p.dataset.hex.replace('#',''), 16);
        viewer.mat.color.setHex(hex);
        viewer.selectedColor = hex; // mémoriser la couleur
        card.querySelectorAll('.pastille').forEach(pp => pp.style.outline = 'none');
        p.style.outline = '2px solid #00e5c7';
        p.style.outlineOffset = '2px';
      });
    });
  }, 50);
});

function openLightbox(c) {
  // Réinitialiser la rotation du viewer de la carte précédente
  if (currentCardId && cardViewers[currentCardId]) {
    cardViewers[currentCardId].mesh.rotation.set(0, 0, 0);
  }
  currentCardId = c.id;

  const lbPastilles = COULEURS.map(col => `<div class="lb-pastille" data-hex="${col.hex}" style="cursor:pointer"><div style="background:${col.hex}"></div>${col.nom}</div>`).join('');
  lbPanel.innerHTML = `
    <button class="lb-close" id="lbClose">✕</button>
    <div class="lb-viewer" id="lb-viewer" style="min-height:340px"></div>
    <div class="lb-info">
      <div class="lb-title">${c.title}</div>
      <div class="lb-desc">${c.desc}</div>
      <div class="lb-specs">
        <div><div class="k">Matériau</div><div class="v">${c.material}</div></div>
        <div><div class="k">Temps d'impression</div><div class="v">${c.printTime}</div></div>
      </div>
      ${c.personnalisable ? `<button class="lb-personnalise-btn" onclick="showCustomize()">Personnalisé</button>` : ''}
      <div class="lb-couleurs"><span class="label">Couleurs disponibles</span>${lbPastilles}</div>
    </div>
  `;
  document.getElementById('lbClose').onclick = closeLightbox;
  lightbox.classList.add('open');
  setTimeout(() => {
    lbViewer = createViewer(document.getElementById('lb-viewer'), c.stl);
    // Appliquer la couleur choisie sur la carte si elle existe
    const savedColor = cardViewers[c.id] && cardViewers[c.id].selectedColor;
    if (savedColor) lbViewer.mat.color.setHex(savedColor);
    lbPanel.querySelectorAll('.lb-pastille').forEach(p => {
      const hex = parseInt(p.dataset.hex.replace('#',''), 16);
      // Marquer la pastille active
      if (savedColor && hex === savedColor) {
        p.querySelector('div').style.outline = '2px solid #00e5c7';
        p.querySelector('div').style.outlineOffset = '2px';
      }
      p.addEventListener('click', () => {
        lbViewer.mat.color.setHex(hex);
        // Synchroniser aussi la couleur sur la carte
        if (cardViewers[c.id]) {
          cardViewers[c.id].mat.color.setHex(hex);
          cardViewers[c.id].selectedColor = hex;
        }
        lbPanel.querySelectorAll('.lb-pastille div').forEach(d => d.style.outline = 'none');
        p.querySelector('div').style.outline = '2px solid #00e5c7';
        p.querySelector('div').style.outlineOffset = '2px';
      });
    });
  }, 50);
}

function closeLightbox() {
  // Réinitialiser la rotation de la carte quand on ferme
  if (currentCardId && cardViewers[currentCardId]) {
    cardViewers[currentCardId].mesh.rotation.set(0, 0, 0);
  }
  if (lbViewer) { cancelAnimationFrame(lbViewer.animId); lbViewer.renderer.dispose(); lbViewer=null; }
  lightbox.classList.remove('open');
}

lightbox.addEventListener('click', e => { if(e.target===lightbox) closeLightbox(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeLightbox(); });


// ===== Navigation entre la galerie et l'atelier de personnalisation =====
function showCustomize() {
  closeLightbox();
  document.getElementById('galleryView').style.display = 'none';
  document.getElementById('customizeView').style.display = 'block';
  if (!czInitialized) { initCustomizer(); czInitialized = true; }
  window.scrollTo(0,0);
}
function showGallery() {
  document.getElementById('customizeView').style.display = 'none';
  document.getElementById('galleryView').style.display = 'block';
  window.scrollTo(0,0);
}

// ===== Atelier de personnalisation du porte-clés =====
let czInitialized = false;

function initCustomizer() {
  const stlData = CREATIONS.find(c => c.id === "002").stl;
  const container = document.getElementById('czViewer');
  let vw = container.clientWidth || 900;
  let vh = container.clientHeight || 600;
  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setSize(vw, vh);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setClearColor(0x06090a, 1);
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, vw/vh, 0.1, 10000);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dirL = new THREE.DirectionalLight(0xffffff, 1.0);
  dirL.position.set(1, 2, 3);
  scene.add(dirL);
  const dirL2 = new THREE.DirectionalLight(0xffffff, 0.3);
  dirL2.position.set(-2, -1, -1);
  scene.add(dirL2);

  const geo = parseSTL(stlData);
  geo.center();
  geo.computeBoundingBox();
  const box = geo.boundingBox;
  const dims = new THREE.Vector3();
  box.getSize(dims);
  const maxDim = Math.max(dims.x, dims.y, dims.z);
  const topZ = box.max.z;

  const keyMat = new THREE.MeshPhongMaterial({ color:0xf0f0f0, specular:0x080808, shininess:5 });
  const keyMesh = new THREE.Mesh(geo, keyMat);

  const group = new THREE.Group();
  group.add(keyMesh);
  scene.add(group);

  camera.position.set(0, -maxDim*0.3, maxDim*0.85);
  camera.lookAt(0, 0, 0);

  window.addEventListener('resize', () => {
    if (document.getElementById('customizeView').style.display === 'none') return;
    vw = container.clientWidth; vh = container.clientHeight;
    camera.aspect = vw / vh;
    camera.updateProjectionMatrix();
    renderer.setSize(vw, vh);
  });

  let isDragging = false, prevX = 0, prevY = 0;
  container.addEventListener('mousedown', e => { isDragging=true; prevX=e.clientX; prevY=e.clientY; });
  window.addEventListener('mouseup', () => isDragging=false);
  container.addEventListener('mousemove', e => {
    if (!isDragging) return;
    group.rotation.y += (e.clientX - prevX) * 0.01;
    group.rotation.x += (e.clientY - prevY) * 0.01;
    prevX=e.clientX; prevY=e.clientY;
  });
  let prevTX=0, prevTY=0;
  container.addEventListener('touchstart', e => { prevTX=e.touches[0].clientX; prevTY=e.touches[0].clientY; });
  container.addEventListener('touchmove', e => {
    group.rotation.y += (e.touches[0].clientX - prevTX) * 0.01;
    group.rotation.x += (e.touches[0].clientY - prevTY) * 0.01;
    prevTX=e.touches[0].clientX; prevTY=e.touches[0].clientY;
    e.preventDefault();
  }, {passive:false});

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();

  const txtInput = document.getElementById('czTxt');
  const sizeRange = document.getElementById('czSize');
  const thickRange = document.getElementById('czThick');
  const sizeVal = document.getElementById('czSizeVal');
  const thickVal = document.getElementById('czThickVal');
  const fontStatus = document.getElementById('czFontStatus');
  const swatchesEl = document.getElementById('czSwatches');

  let currentTextHex = 0x1a1a1a; // Noir par défaut
  const textMat = new THREE.MeshPhongMaterial({ color:currentTextHex, specular:0x222222, shininess:40 });

  const keySwatchesEl = document.getElementById('czKeySwatches');
  let currentKeyHex = 0xf0f0f0; // Blanc par défaut

  function makeSwatches(el, selectedHex, onPick) {
    COULEURS.forEach(col => {
      const hex = parseInt(col.hex.replace('#',''), 16);
      const sw = document.createElement('div');
      sw.className = 'swatch' + (hex === selectedHex ? ' selected' : '');
      sw.style.background = col.hex;
      sw.title = col.nom;
      sw.addEventListener('click', () => {
        onPick(hex);
        el.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
        sw.classList.add('selected');
      });
      el.appendChild(sw);
    });
  }

  makeSwatches(keySwatchesEl, currentKeyHex, hex => { currentKeyHex = hex; keyMat.color.setHex(hex); });
  makeSwatches(swatchesEl, currentTextHex, hex => { currentTextHex = hex; textMat.color.setHex(hex); });

  let font = null;
  let textMesh = null;

  function rebuildText() {
    if (!font) return;
    const text = txtInput.value || '';

    if (textMesh) { group.remove(textMesh); textMesh.geometry.dispose(); textMesh = null; }
    if (!text.trim()) return;

    const s = parseFloat(sizeRange.value);
    const t = parseFloat(thickRange.value);

    const tg = new THREE.TextGeometry(text, {
      font: font,
      size: s,
      height: t,
      curveSegments: 6,
      bevelEnabled: false
    });
    tg.computeBoundingBox();
    const tb = tg.boundingBox;
    const tw = tb.max.x - tb.min.x;
    const th = tb.max.y - tb.min.y;
    tg.translate(-tw/2, -th/2, 0);

    textMesh = new THREE.Mesh(tg, textMat);
    textMesh.position.set(0, 0, topZ + 0.08);
    group.add(textMesh);
  }

  new THREE.FontLoader().load(
    'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_regular.typeface.json',
    (loadedFont) => {
      font = loadedFont;
      fontStatus.textContent = '';
      rebuildText();
    },
    undefined,
    () => {
      fontStatus.textContent = "Impossible de charger la police (vérifie ta connexion).";
    }
  );

  txtInput.addEventListener('input', rebuildText);
  sizeRange.addEventListener('input', () => { sizeVal.textContent = parseFloat(sizeRange.value).toFixed(1) + ' mm'; rebuildText(); });
  thickRange.addEventListener('input', () => { thickVal.textContent = parseFloat(thickRange.value).toFixed(1) + ' mm'; rebuildText(); });

  // Bouton Envoyer : envoie directement la demande (texte, couleurs, taille, épaisseur) par mail
  const sendBtn = document.getElementById('czSend');
  const sendNote = document.getElementById('czSendNote');
  const copyBtn = document.getElementById('czCopy');
  const COPY_LABEL = copyBtn.textContent;
  const clearNote = () => { sendNote.textContent = ''; copyBtn.hidden = true; copyBtn.textContent = COPY_LABEL; };
  [txtInput, sizeRange, thickRange].forEach(el => el.addEventListener('input', clearNote));
  swatchesEl.addEventListener('click', clearNote);
  keySwatchesEl.addEventListener('click', clearNote);

  const nomCouleur = hex => {
    const c = COULEURS.find(c => parseInt(c.hex.replace('#',''), 16) === hex);
    return c ? c.nom : '#' + hex.toString(16);
  };
  const currentDetails = () => ({
    modele: CREATIONS.find(c => c.id === "002").title,
    texte: txtInput.value.trim(),
    couleurPorteCle: nomCouleur(currentKeyHex),
    couleur: nomCouleur(currentTextHex),
    taille: parseFloat(sizeRange.value).toFixed(1),
    epaisseur: parseFloat(thickRange.value).toFixed(1)
  });

  sendBtn.addEventListener('click', async () => {
    const d = currentDetails();
    if (!d.texte) {
      sendNote.textContent = "Écris d'abord un texte à mettre sur le porte-clés.";
      copyBtn.hidden = true;
      return;
    }
    sendBtn.disabled = true;
    sendBtn.textContent = "Envoi en cours…";
    sendNote.textContent = "";
    copyBtn.hidden = true;
    copyBtn.textContent = COPY_LABEL;
    try {
      const r = await envoyerDemande(d);
      if (r.ok) {
        sendNote.textContent = "Ta demande a bien été envoyée ✓";
      } else {
        console.warn("Envoi non abouti :", r);
        sendNote.textContent = messageEchec(r);
        copyBtn.hidden = false;
      }
    } catch (err) {
      sendNote.textContent = messageEchec({ type: "inconnu", message: "", detail: (err && err.message) ? err.message : String(err) });
      copyBtn.hidden = false;
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = "Envoyer";
    }
  });

  copyBtn.addEventListener('click', () => {
    const r = buildRecap(currentDetails());
    const texte = "Objet : " + r.sujet + "\n\n" + r.corps.replace(/\r\n/g, "\n");
    const fini = () => { copyBtn.textContent = "Message copié ✓ — colle-le dans un mail à " + EMAIL_RECEPTION; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texte).then(fini, () => { copieSecours(texte); fini(); });
    } else {
      copieSecours(texte);
      fini();
    }
  });
}
</script>
